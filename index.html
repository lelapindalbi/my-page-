<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=UnifrakturCook:wght@700&family=UnifrakturMaguntia&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Orbitron', sans-serif;
      background: black;
      overflow: hidden;
    }

    

    
      100% { transform: rotate(360deg) scale(1.2); }
    }

    .card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top, rgba(255,255,255,0.05), transparent 60%);
      pointer-events: none;
    }
      color: white;
      height: 100vh;
    }

    /* BACKGROUND */
    .bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: -3;
      overflow: hidden;
      background:
        radial-gradient(circle at center, rgba(255,0,170,0.18), transparent 35%),
        linear-gradient(to bottom, #050008 0%, #120018 40%, #050008 100%);
    }

    .bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(rgba(255,0,170,0.08), rgba(0,183,255,0.04)),
        url('cyber-night.jpg') center/cover no-repeat;
      opacity: 0.38;
      filter: blur(1px) saturate(1.25);
      transform: scale(1.03);
    }

    .bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,0.015),
          rgba(255,255,255,0.015) 1px,
          transparent 1px,
          transparent 4px
        );
      mix-blend-mode: overlay;
      opacity: 0.4;
      animation: flicker 6s infinite;
    }

    @keyframes flicker {
      0% { opacity: 0.25; }
      50% { opacity: 0.45; }
      100% { opacity: 0.25; }
    }

    .overlay {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at center, rgba(255,0,140,0.12), rgba(0,0,0,0.92)),
        linear-gradient(to bottom, rgba(0,0,0,0.2), rgba(0,0,0,0.85));
      z-index: -2;
    }

    /* ENTER SCREEN */
    .enter-screen {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      cursor: pointer;
      transition: opacity 0.8s ease;
    }

    .enter-text {
      font-size: 2rem;
      color: white;
      font-weight: 700;
      text-shadow: 0 0 20px #ff00aa;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
      100% { opacity: 0.5; transform: scale(1); }
    }

    /* MAIN CARD */
    .container {
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 420px;
      padding: 35px;
      border-radius: 28px;
      background: rgba(10,10,10,0.28);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(22px);
      text-align: center;
      box-shadow:
        0 0 45px rgba(255,0,170,0.15),
        0 0 120px rgba(0,140,255,0.08),
        inset 0 0 25px rgba(255,255,255,0.03);
      animation: appear 1.2s ease;
      position: relative;
      overflow: hidden;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0px);
      }
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: none !important;
      outline: none !important;
      background: transparent !important;
      box-shadow:
        0 0 25px rgba(255,0,170,0.35),
        0 0 50px rgba(0,183,255,0.2);
      margin-bottom: 20px;
      animation: neonPulse 3s infinite;
      transition: 0.35s ease;
    }

    .avatar:hover {
      transform: scale(1.08) rotate(2deg);
      filter:
        drop-shadow(0 0 20px #ff00aa)
        drop-shadow(0 0 35px #00b7ff);
    }

    h1 {
      font-size: 3rem;
      font-weight: 800;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #ff00aa, #00b7ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .bio {
      color: rgba(255,255,255,0.72);
      margin-bottom: 28px;
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link {
      text-decoration: none;
      color: white;
      padding: 16px;
      border-radius: 18px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      transition: 0.25s ease;
      font-weight: 600;
      letter-spacing: 1px;
      position: relative;
      overflow: hidden;
    }

    .link::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(255,0,170,0.18), rgba(0,183,255,0.18));
      opacity: 0;
      transition: 0.25s;
    }

    .link:hover::before {
      opacity: 1;
    }

    .link:hover {
      transform: scale(1.05) translateY(-2px);
      box-shadow:
        0 0 25px rgba(255,0,170,0.22),
        0 0 45px rgba(0,183,255,0.12);
      letter-spacing: 2px;
    }

    .link span {
      position: relative;
      z-index: 2;
    }

    .footer {
      margin-top: 25px;
      color: rgba(255,255,255,0.35);
      font-size: 0.75rem;
    }

    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
    }

    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      background: rgba(255,255,255,0.4);
      border-radius: 50%;
      animation: float 8s linear infinite;
    }

    @keyframes float {
      from {
        transform: translateY(100vh) scale(0.5);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      50% {
        opacity: 0.8;
      }
      to {
        transform: translateY(-10vh) scale(1.2);
        opacity: 0;
      }
    }

    /* GLITCH EFFECT */
    .glitch {
      position: relative;
      animation: glitch 2s infinite;
    }

    @keyframes glitch {
      0% { transform: translate(0); }
      20% { transform: translate(-2px, 2px); }
      40% { transform: translate(-2px, -2px); }
      60% { transform: translate(2px, 2px); }
      80% { transform: translate(2px, -2px); }
      100% { transform: translate(0); }
    }

    /* SCANLINES */
    .scanlines::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.02),
        rgba(255,255,255,0.02) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      z-index: 9999;
      mix-blend-mode: overlay;
    }

    /* CARD HOVER */
    .card:hover {
      transform: scale(1.015);
      transition: 0.35s ease;
      box-shadow:
        0 0 60px rgba(255,0,170,0.25),
        0 0 120px rgba(0,183,255,0.12);
    }

    /* NEON PULSE */
    .avatar {
      animation: neonPulse 3s infinite;
    }

    @keyframes neonPulse {
      0% { filter: drop-shadow(0 0 5px #ff00aa); }
      50% { filter: drop-shadow(0 0 20px #00b7ff); }
      100% { filter: drop-shadow(0 0 5px #ff00aa); }
    }
      10% {
        opacity: 1;
      }
      to {
        transform: translateY(-10vh);
        opacity: 0;
      }
    }

    /* EXTRA CYBER GLITCH FX — keeps the original layout */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      opacity: .22;
      background:
        repeating-linear-gradient(0deg, transparent 0 3px, rgba(0, 225, 255, .09) 4px, transparent 5px 7px),
        repeating-linear-gradient(90deg, transparent 0 96px, rgba(255, 0, 170, .08) 97px, transparent 99px 160px);
      mix-blend-mode: screen;
      animation: cyberScan 7s linear infinite;
    }

    body::after {
      content: "";
      position: fixed;
      inset: -20%;
      pointer-events: none;
      z-index: 19;
      opacity: .12;
      background: linear-gradient(transparent 45%, rgba(255, 0, 170, .45) 49%, rgba(0, 220, 255, .4) 51%, transparent 56%);
      transform: translateY(-100%);
      animation: scanSweep 8s linear infinite;
    }

    @keyframes cyberScan {
      0%, 92%, 100% { transform: translateX(0); opacity: .13; }
      93% { transform: translateX(-5px); opacity: .38; }
      95% { transform: translateX(4px); opacity: .28; }
      97% { transform: translateX(-2px); opacity: .18; }
    }
    @keyframes scanSweep {
      to { transform: translateY(100%); }
    }

    /* RGB edge glow and occasional digital distortion on the title */
    h1.glitch {
      position: relative;
      text-shadow: 2px 0 rgba(0, 240, 255, .75), -2px 0 rgba(255, 0, 170, .7);
      animation: titleGlitch 4.5s infinite;
    }
    @keyframes titleGlitch {
      0%, 87%, 90%, 100% { transform: translate(0); filter: none; }
      88% { transform: translate(-3px, 1px); filter: hue-rotate(80deg); }
      89% { transform: translate(4px, -1px); filter: saturate(2); }
      91% { transform: translate(-1px, 0); }
    }

    .card::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      pointer-events: none;
      z-index: 3;
      background: linear-gradient(115deg, transparent 15%, rgba(0, 225, 255, .2) 48%, rgba(255, 0, 170, .24) 52%, transparent 72%);
      background-size: 240% 100%;
      animation: hologramSweep 6s linear infinite;
      mix-blend-mode: screen;
    }
    @keyframes hologramSweep {
      0% { background-position: 150% 0; opacity: .15; }
      50% { opacity: .5; }
      100% { background-position: -80% 0; opacity: .15; }
    }

    .card {
      isolation: isolate;
    }
    .card > * {
      position: relative;
      z-index: 4;
    }
    .card:hover {
      animation: cardSignal 1.8s infinite;
    }
    @keyframes cardSignal {
      0%, 90%, 100% { filter: none; }
      91% { filter: drop-shadow(3px 0 rgba(255, 0, 170, .5)); }
      93% { filter: drop-shadow(-3px 0 rgba(0, 225, 255, .5)); }
      95% { filter: none; }
    }

    .link {
      isolation: isolate;
    }
    .link::after {
      content: "";
      position: absolute;
      top: -30%;
      bottom: -30%;
      left: -75%;
      width: 45%;
      transform: skewX(-22deg);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), rgba(0,225,255,.24), transparent);
      transition: left .55s ease;
      z-index: 1;
      pointer-events: none;
    }
    .link:hover::after {
      left: 135%;
    }
    .link:hover {
      border-color: rgba(0, 225, 255, .55);
      text-shadow: 0 0 8px rgba(255,255,255,.75);
      animation: buttonGlitch .22s steps(2, end) 2;
    }
    @keyframes buttonGlitch {
      0% { transform: translate(0) scale(1.05) translateY(-2px); }
      25% { transform: translate(2px, -1px) scale(1.05); }
      50% { transform: translate(-2px, 1px) scale(1.05); }
      100% { transform: translate(0) scale(1.05) translateY(-2px); }
    }

    .avatar {
      outline: 1px solid rgba(0, 225, 255, .75);
      outline-offset: 5px;
    }
    .bio.glitch {
      animation: bioSignal 7s infinite;
    }
    @keyframes bioSignal {
      0%, 93%, 100% { transform: translateX(0); text-shadow: none; }
      94% { transform: translateX(2px); text-shadow: -2px 0 #ff00aa, 2px 0 #00b7ff; }
      95% { transform: translateX(-2px); }
      96% { transform: translateX(0); }
    }

    .particle:nth-child(3n) { background: #ff00aa; box-shadow: 0 0 8px #ff00aa; }
    .particle:nth-child(4n) { background: #00e5ff; box-shadow: 0 0 8px #00e5ff; }
    .particle:nth-child(7n) { width: 2px; height: 10px; border-radius: 0; opacity: .7; }

    @media (prefers-reduced-motion: reduce) {
      body::before, body::after, h1.glitch, .card::before, .bio.glitch,
      .link:hover, .particle { animation-duration: 20s; }
    }


    /* Falling cyber code inspired by a futuristic terminal */
    #code-rain {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: .58;
      mix-blend-mode: screen;
    }
    .overlay { z-index: 0; }
    .particles { z-index: 0; }
    .container {
      position: relative;
      z-index: 2;
    }
    .enter-screen { z-index: 999; }
    @media (max-width: 600px) {
      #code-rain { opacity: .38; }
    }


    

    /* SHATTEREDHEART — compact Fraktur title with animated white/cyan/red gradient */
    h1.shattered-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .12em;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      margin: 0 auto 10px;
      font-family: 'UnifrakturCook', 'UnifrakturMaguntia', serif;
      font-size: clamp(1.05rem, 3.5vw, 2.05rem);
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -.035em;
      white-space: nowrap;
      overflow: visible;
      background: none;
      -webkit-text-fill-color: initial;
      color: #fff;
      text-shadow: none;
      animation: shatteredGlitch 3.7s infinite;
    }

    h1.shattered-title .title-word {
      display: inline-block;
      background: linear-gradient(
        90deg,
        #ffffff 0%,
        #00eaff 32%,
        #b8fbff 48%,
        #ff244f 72%,
        #ffffff 100%
      );
      background-size: 250% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      animation: heartColorFlow 4s linear infinite;
      filter: drop-shadow(0 0 5px rgba(0, 234, 255, .45));
    }

    h1.shattered-title .title-symbol {
      flex: 0 0 auto;
      display: inline-block;
      font-family: system-ui, sans-serif;
      font-size: .58em;
      line-height: 1;
      -webkit-text-fill-color: initial;
      filter: drop-shadow(0 0 4px rgba(0, 234, 255, .25));
    }

    @keyframes heartColorFlow {
      0% { background-position: 0% 50%; }
      100% { background-position: 250% 50%; }
    }

    @keyframes shatteredGlitch {
      0%, 88%, 92%, 100% { transform: translateX(0) skewX(0); }
      89% { transform: translateX(-2px) skewX(-2deg); }
      90% { transform: translateX(3px) skewX(1deg); }
      91% { transform: translateX(-1px); }
    }

    @media (max-width: 600px) {
      h1.shattered-title {
        font-size: clamp(.88rem, 4.2vw, 1.5rem);
        gap: .08em;
        letter-spacing: -.045em;
      }
      h1.shattered-title .title-symbol { font-size: .52em; }
    }

    @media (max-width: 360px) {
      h1.shattered-title {
        font-size: .82rem;
        gap: .05em;
        letter-spacing: -.055em;
      }
    }

  </style>

  <!-- MAIN -->
  <div class="container">

      <h1 class="glitch shattered-title"><span class="title-symbol" aria-hidden="true">🩸</span><span class="title-word">SHATTEREDHEART</span><span class="title-symbol" aria-hidden="true">🖤</span></h1>

  <script>
    const music = document.getElementById('music');

    // Ta musique d'origine est conservée et incluse dans la playlist.
    // Les 7 nouveaux fichiers sont à la racine, à côté de index.html.
    const playlist = [
      'music.mp3',
      'music-01.mp3',
      'music-02.mp3',
      'music-03.mp3',
      'music-04.mp3',
      'music-05.mp3',
      'music-06.mp3',
      'music-07.mp3'
    ];

    let shuffledPlaylist = [];
    let currentTrack = 0;
    let failedTracks = 0;
    let isEntering = false;

    function shufflePlaylist() {
      shuffledPlaylist = [...playlist];

      // Mélange Fisher-Yates : aucun morceau ne se répète avant le prochain cycle.
      for (let i = shuffledPlaylist.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffledPlaylist[i], shuffledPlaylist[j]] =
          [shuffledPlaylist[j], shuffledPlaylist[i]];
      }

      currentTrack = 0;
      failedTracks = 0;
    }

    function playNextTrack() {
      if (shuffledPlaylist.length === 0 || currentTrack >= shuffledPlaylist.length) {
        shufflePlaylist();
      }

      if (failedTracks >= shuffledPlaylist.length) {
        console.warn('Aucun morceau n’a pu être lu. Vérifie les fichiers audio.');
        return;
      }

      const track = shuffledPlaylist[currentTrack++];
      music.src = track;
      music.load();

      const promise = music.play();
      if (promise && typeof promise.catch === 'function') {
        promise.catch((error) => {
          console.warn('Impossible de lire ' + track, error);
          failedTracks++;
          if (failedTracks < shuffledPlaylist.length) {
            playNextTrack();
          }
        });
      }
    }

    music.addEventListener('ended', () => {
      failedTracks = 0;
      playNextTrack();
    });

    function enterSite() {
      if (isEntering) return;
      isEntering = true;

      const enterScreen = document.getElementById('enterScreen');
      enterScreen.style.opacity = '0';

      setTimeout(() => {
        enterScreen.style.display = 'none';
      }, 800);

      shufflePlaylist();
      playNextTrack();
    }

    document.getElementById('enterScreen').addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        enterSite();
      }
    });



    // Falling code rain: glowing characters like a cyber terminal / eDEX-UI.
    (() => {
      const canvas = document.getElementById('code-rain');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      if (!ctx) return;

      const glyphs = '01アイウエオカキクケコサシスセソABCDEFGHIJKLMNOPQRSTUVWXYZ<>/{}[]#$%&';
      let width = 0;
      let height = 0;
      let fontSize = 15;
      let columns = 0;
      let drops = [];

      function resizeCodeRain() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        fontSize = width < 600 ? 12 : 15;
        columns = Math.ceil(width / fontSize);
        drops = Array.from({ length: columns }, () =>
          Math.random() * (height / fontSize)
        );
        ctx.font = `600 ${fontSize}px monospace`;
      }

      function drawCodeRain() {
        // A translucent wash leaves trails instead of clearing each frame.
        ctx.fillStyle = 'rgba(3, 0, 12, 0.10)';
        ctx.fillRect(0, 0, width, height);
        ctx.font = `600 ${fontSize}px monospace`;

        for (let i = 0; i < drops.length; i++) {
          const char = glyphs[Math.floor(Math.random() * glyphs.length)];
          const x = i * fontSize;
          const y = drops[i] * fontSize;
          const palette = Math.random();
          ctx.fillStyle = palette > .78
            ? 'rgba(0, 225, 255, 0.85)'
            : palette > .48
              ? 'rgba(255, 0, 190, 0.72)'
              : 'rgba(155, 255, 220, 0.62)';
          ctx.shadowColor = palette > .5 ? '#00e5ff' : '#ff00aa';
          ctx.shadowBlur = 7;
          ctx.fillText(char, x, y);
          ctx.shadowBlur = 0;

          if (y > height && Math.random() > .975) {
            drops[i] = 0;
          } else {
            drops[i] += Math.random() > .96 ? 1.8 : .72;
          }
        }
        requestAnimationFrame(drawCodeRain);
      }

      window.addEventListener('resize', resizeCodeRain, { passive: true });
      resizeCodeRain();
      drawCodeRain();
    })();

    // Rare full-screen RGB glitch pulses, with the original page and audio unchanged.
    const glitchPulse = document.createElement('div');
    glitchPulse.setAttribute('aria-hidden', 'true');
    glitchPulse.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:18;opacity:0;background:linear-gradient(transparent 42%,rgba(255,0,170,.18) 47%,rgba(0,225,255,.16) 53%,transparent 58%);mix-blend-mode:screen;';
    document.body.appendChild(glitchPulse);
    function triggerGlitchPulse() {
      glitchPulse.animate([
        { opacity: 0, transform: 'translateX(0)' },
        { opacity: .7, transform: 'translateX(-4px)', offset: .25 },
        { opacity: .35, transform: 'translateX(5px)', offset: .55 },
        { opacity: 0, transform: 'translateX(0)' }
      ], { duration: 260, easing: 'steps(2, end)' });
      window.setTimeout(triggerGlitchPulse, 6500 + Math.random() * 9000);
    }
    window.setTimeout(triggerGlitchPulse, 3500);

    // PARTICLES
    const particles = document.getElementById('particles');

    for(let i = 0; i < 80; i++) {
      const p = document.createElement('div');
      p.classList.add('particle');
      p.style.left = Math.random() * 100 + 'vw';
      p.style.animationDuration = (Math.random() * 5 + 5) + 's';
      p.style.animationDelay = Math.random() * 5 + 's';
      particles.appendChild(p);
    }
  </script>

</body>
</html>
